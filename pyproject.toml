[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-cap"
version = "0.1.0"
description = "Pre-flight USD cost gate for a single LLM call. Estimate input + output cost from token counts and reject before sending if it would exceed a per-call cap. Built-in price table for major providers. Zero runtime deps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mukunda Rao Katta", email = "mukunda.vjcs6@gmail.com" }]
keywords = [
  "llm",
  "ai",
  "cost",
  "budget",
  "cap",
  "pricing",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/llm-cost-cap"
Issues = "https://github.com/MukundaKatta/llm-cost-cap/issues"
Source = "https://github.com/MukundaKatta/llm-cost-cap"
"Sibling (running total)" = "https://github.com/MukundaKatta/token-budget-py"
"Sibling (time window)" = "https://github.com/MukundaKatta/llm-budget-window"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_cap"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
